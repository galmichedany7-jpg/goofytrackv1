# Render blueprint for the GoofyTrack multiplayer server (see README, "Serveur multijoueur")
services:
  - type: web
    name: goofytrack
    runtime: node
    plan: free
    rootDir: sources/server
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: ICE_SERVERS   # optional TURN servers, JSON array
        sync: false
      - key: GITHUB_TOKEN  # keeps the mod tracks' records and the accounts in secret gists (token with the "gist" scope)
        sync: false
      - key: UNLOCKS       # who owns the garage's icons, by account number: "mp4_7a:7777+42" (sources/server/accounts.js)
        sync: false
